name: CI/CD Pipeline da API Flask

on: [push, pull_request]

jobs:
  build_and_test:
    name: Build, Teste e Qualidade
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # ⚠️ NOVO STEP CRUCIAL: Instala o binário docker-compose (v1)
      - name: Instalar Docker Compose (V1)
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version # Verifica a instalação

      # O resto do código permanece o mesmo, usando cd lab_api
      - name: Executar Testes Unitários com Docker Compose
        run: |
          cd lab_api 
          docker-compose run --rm api python test_app.py 
          
      - name: Limpeza de containers e rede
        if: always()
        run: |
          cd lab_api
          docker-compose down