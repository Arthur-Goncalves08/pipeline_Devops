name: CI/CD Pipeline da API Flask

on: [push, pull_request]

jobs:
  build_and_test:
    name: Build, Teste e Qualidade
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Step 2: Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ⚠️ NOVO STEP: Configurar Docker Compose (Resolve o 'command not found')
      - name: Configurar Docker Compose
        uses: docker/setup-qemu-action@v3

      # Agora podemos usar o Docker Compose nos comandos 'run'
      - name: Executar Testes Unitários com Docker Compose
        run: |
          cd lab_api 
          docker-compose run --rm api python test_app.py 
          
      - name: Limpeza de containers e rede
        if: always()
        run: |
          cd lab_api
          docker-compose down