name: CI/CD Pipeline da API Flask

on: [push, pull_request]

jobs:
  build_and_test:
    name: Build, Teste e Qualidade
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # ⚠️ NOVO BLOC0: CONFIGURAÇÃO COMPLETA DO AMBIENTE DOCKER
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ação crucial para garantir que o Docker Compose (V2) esteja disponível
      - name: Verificar e Instalar Docker Compose CLI (se necessário)
        run: |
          docker compose version || sudo apt-get install -y docker-compose-plugin

      # O resto do código (a execução dos testes) permanece o mesmo.
      - name: Executar Testes Unitários com Docker Compose
        run: |
          cd lab_api 
          docker-compose run --rm api python test_app.py 
          
      - name: Limpeza de containers e rede
        if: always()
        run: |
          cd lab_api
          docker-compose down