# ----------------------------------------------------
# JOB 1: BUILD (Construção e Push da Imagem)
# ----------------------------------------------------
  build:
    name: 1. Construir Imagem e Enviar para o GHCR
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write # Necessário para enviar a imagem ao GHCR
    
    # ⚠️ NOVO: Crie uma variável de ambiente que converte o nome do repositório para minúsculo
    env:
      IMAGE_TAG: ${{ github.sha }}
      REPO_LOWER: ${{ toLower(github.repository) }} # Converte 'Arthur-Goncalves08/pipeline_Devops' para minúsculas

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTAINER_PATH }}
          push: true
          # ⚠️ CORRIGIDO: Usa a nova variável 'REPO_LOWER'
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max