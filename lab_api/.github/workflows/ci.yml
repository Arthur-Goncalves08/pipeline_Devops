name: CI/CD Pipeline da API Flask

# 1. Definição do Gatilho (Trigger) SIMPLIFICADO
# Este bloco é o ponto de falha mais comum. 
# Simplificamos para garantir a sintaxe correta do YAML.
on: [push, pull_request]

# 2. Definição dos Jobs (Tarefas)
jobs:
  build_and_test:
    name: Build, Teste e Qualidade
    runs-on: ubuntu-latest
    
    # DEFINE O DIRETÓRIO DE TRABALHO: CORRETO!
    defaults:
      run:
        working-directory: ./lab_api
        
    # 3. Definição dos Steps (Passos)
    steps:
      # Step 1: Checkout do código (Ação)
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Step 2: Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Executar Testes Unitários com Docker Compose
        run: |
          echo "Iniciando a construção da imagem e execução dos testes..."
          # O working-directory garante que ele encontre o docker-compose.yml
          docker-compose run --rm api python test_app.py 
          echo "Testes concluídos."

      - name: Limpeza de containers e rede
        if: always()
        run: docker-compose down